<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", Inter, system-ui, sans-serif;
      background: #e8ecf1;
      color: #1a1d21;
    }
    .box {
      max-width: 28rem;
      padding: 2rem;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(15, 23, 42, 0.08);
    }
    h1 { margin: 0 0 0.5rem; font-size: 1.35rem; }
    p { margin: 0 0 1rem; color: #5c6370; line-height: 1.5; }
    a { color: #2563eb; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Page not found</h1>
    <p>This link is missing or no longer available.</p>
    <p><a href="/">Go to home</a></p>
  </div>
</body>
</html>
